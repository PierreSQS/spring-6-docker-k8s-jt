services:
  mysql-8.0:
    image: mysql:8.0
    container_name: mysql-8.0
    environment:
      MYSQL_ROOT_PASSWORD: Galerien3?
      MYSQL_USER: restdadmin
      MYSQL_PASSWORD: restadmin
      MYSQL_DATABASE: restdb
    volumes:
      - mysql-8.0:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3309:3306"

volumes:
  mysql-8.0: